[workspace]
name = "navier-stokes-history"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
numpy = ">=1.26"
matplotlib = ">=3.8"
plotly = ">=5.18"
scipy = ">=1.12"
jupyter = ">=1.0"
ipykernel = ">=6.0"

[tasks]
render     = "quarto render"
render-pdf = "quarto render --to pdf"
preview    = "quarto preview"
kernel     = "python -m ipykernel install --user --name navier-stokes-history --display-name 'Navier-Stokes History'"
